# theme.toml template for a Hugo theme
# See https://github.com/gohugoio/hugoThemes#themetoml for an example

name = "Cookbook"
license = "MIT"
licenselink = "https://github.com/dpasut/hugo-cookbook-v2/blob/master/LICENSE"
description = "A Hugo theme for organizing and displaying your recipes in a clean, responsive format."
