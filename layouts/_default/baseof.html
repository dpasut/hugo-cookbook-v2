<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
    {{- partial "head.html" . -}}

    <body>
        <a class="visually-hidden-focusable" href="#content">Skip to main content</a>
        {{- partial "alert.html" -}}
        {{- partial "header.html" . -}}
        {{- partial "searchResults.html" -}}
        <div id="content">
            {{- block "main" . }}{{ end }}
        </div>
        {{- partial "footer.html" . -}}
        <script>window.hugoBaseURL = "{{ .Site.Home.RelPermalink }}"</script>
        {{- partial "script.html" . -}}
    </body>

</html>
