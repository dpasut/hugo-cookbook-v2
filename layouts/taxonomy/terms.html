{{ define "main" }}
<div class="container my-5">
    <span class="h2 d-block text-center">{{ .Title }}</span>
    <i class="fas fa-tags fa-2x ps-3 pb-3"></i>
    <div class="row">
        {{ range .Data.Terms.ByCount }}
        <div class="col-12 col-md-4 col-lg-3 mb-4 d-flex">
            <div class="card card-rounded h-100 w-100 terms-card">
                <header class="card-header d-flex justify-content-between align-items-center">
                    <a class="h5 mb-0 text-decoration-none" href="{{ .Page.RelPermalink }}">
                        <i class="fas fa-tags pe-2"></i>{{ .Page.Title }}
                    </a>
                    <span class="badge bg-secondary rounded-pill"
                        title="{{ .Count }} {{ if eq .Count 1 }}recipe{{ else }}recipes{{ end }}">{{ .Count }}</span>
                </header>
                <div class="card-body d-flex flex-column justify-content-between">
                    <ul class="list-unstyled mb-2">
                        {{ range first 5 .Pages }}
                        <li class="text-truncate">
                            <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
                        </li>
                        {{ end }}
                    </ul>
                    {{ if gt .Count 5 }}
                    <a class="small align-self-start" href="{{ .Page.RelPermalink }}">
                        See all {{ .Count }} recipes &rarr;
                    </a>
                    {{ end }}
                </div>
            </div>
        </div>
        {{ end }}
    </div>
</div>
{{ end }}
